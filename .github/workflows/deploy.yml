name: Deploy

# Dispara depois que o workflow "CI" (ci.yml) termina em main — nunca em paralelo com ele,
# nunca em PR. Um build vermelho nunca chega na instância (ver `if` do job abaixo).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Reaproveita exatamente o mesmo git pull + docker compose up --build -d do deploy manual
      # (docs/deployment.md, ADR-0011) — sem registry de imagem (Docker Hub/ECR), a EC2 builda a
      # própria imagem a partir do Dockerfile do repo, como no primeiro deploy.
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd sentinel-auth-api
            git pull
            cat > .env <<ENV_FILE
            POSTGRES_DB=sentinel_auth
            POSTGRES_USER=sentinel
            POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            JWT_SIGNING_KEY=${{ secrets.PROD_JWT_SIGNING_KEY }}
            ENV_FILE
            docker compose up --build -d

            # docker compose up --build -d só confirma que o container subiu, não que a
            # aplicação respondeu de fato — sem isso o job reportaria sucesso mesmo com o
            # container em crash loop. Espera até 60s pelo health check antes de falhar.
            for i in $(seq 1 12); do
              if curl -sf http://localhost/actuator/health > /dev/null; then
                echo "Deploy healthy."
                exit 0
              fi
              sleep 5
            done
            echo "Deploy did not become healthy within 60s." >&2
            docker compose logs --tail 100 app
            exit 1
