name: Deploy

# Dispara depois que o workflow "CI" (ci.yml) termina em main — nunca em paralelo com ele,
# nunca em PR. Um build vermelho nunca chega na instância (ver `if` do job abaixo).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Reaproveita exatamente o mesmo git pull + docker compose up --build -d do deploy manual
      # (docs/deployment.md, ADR-0011) — sem registry de imagem (Docker Hub/ECR), a EC2 builda a
      # própria imagem a partir do Dockerfile do repo, como no primeiro deploy. O overlay
      # docker-compose.prod.yml (ADR-0013) adiciona o Caddy/HTTPS; não depende de nenhum
      # secret novo, já que o hostname sslip.io não é sensível e fica só no `Caddyfile`
      # da instância (não commitado).
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd sentinel-auth-api
            git pull
            cat > .env <<ENV_FILE
            POSTGRES_DB=sentinel_auth
            POSTGRES_USER=sentinel
            POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            JWT_SIGNING_KEY=${{ secrets.PROD_JWT_SIGNING_KEY }}
            SENTINEL_CORS_ALLOWED_ORIGINS=${{ secrets.SENTINEL_CORS_ALLOWED_ORIGINS }}
            ENV_FILE
            # Build isolado do up não bastou: builder e o container antigo do app ainda
            # concorriam por memória durante toda a janela do build, o que já travou a
            # instância duas vezes (ADR-0013 e commit 0b36aa3), exigindo Stop/Start manual.
            # Agora o container antigo é parado ANTES do build — aceita um downtime maior
            # durante o deploy em troca de eliminar essa concorrência de vez.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml stop app
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build app
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # docker compose up -d só confirma que o container subiu, não que a
            # aplicação respondeu de fato — sem isso o job reportaria sucesso mesmo com o
            # container em crash loop. Espera até 60s pelo health check antes de falhar.
            # Health check bate direto no container `app` (porta 8080), não através do
            # Caddy (porta 80/443, ADR-0013) — evita que um problema pontual de TLS/ACME
            # reprove um deploy cuja aplicação subiu normalmente.
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null; then
                echo "Deploy healthy."
                exit 0
              fi
              sleep 5
            done
            echo "Deploy did not become healthy within 60s." >&2
            docker compose logs --tail 100 app
            exit 1
