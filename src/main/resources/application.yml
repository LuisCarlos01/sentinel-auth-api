spring:
  application:
    name: sentinel-auth-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinel_auth}
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

sentinel:
  jwt:
    # Chave de assinatura HS256 do Access token — sempre via variável de ambiente,
    # nunca hardcoded nem commitada (ver .env.example para o default de desenvolvimento).
    signing-key: ${JWT_SIGNING_KEY}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    # Frequência do job de limpeza de Refresh tokens expirados (RefreshTokenCleanupJob).
    # 24h: baixa frequência é suficiente — a única consequência de um atraso é uma linha
    # expirada sobrevivendo um pouco mais no banco, sem risco de segurança (ADR-0008).
    refresh-token-cleanup-interval-ms: 86400000
  rate-limit:
    # Rate limiting em login, por bucket (IP e e-mail, mesma capacidade para os dois) — ADR-0010.
    # Configurável via env var para permitir um valor bem mais alto especificamente no teste de
    # carga (Gatling, ticket #21/docker-compose.loadtest.yml) — o load test do fluxo de auth roda
    # de uma única máquina, todas as requisições saem do mesmo IP de origem, então o bucket por
    # IP (o de e-mail não é problema, já que a simulação varia e-mail por usuário virtual)
    # derrubaria a simulação bem antes de medir a performance real do fluxo.
    login-capacity: ${SENTINEL_RATE_LIMIT_LOGIN_CAPACITY:5}
    login-window-seconds: ${SENTINEL_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
  cors:
    # Lista de origens permitidas, separadas por vírgula (dev + produção do sentinel-auth-web).
    # Sem default: o frontend ainda não tem package.json/porta decidida, então falhar fechado
    # (nenhuma origem permitida) é mais seguro que chutar uma porta comum (5173/3000) que pode
    # nem ser a real. Configurar via SENTINEL_CORS_ALLOWED_ORIGINS assim que a porta for definida.
    allowed-origins: ${SENTINEL_CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
